server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # JS/CSS do build: o hash no nome muda a cada deploy, entao o arquivo
    # nunca muda e pode ficar guardado 1 ano. Arquivo que nao existe (chunk de
    # um deploy antigo) responde 404 em vez do index.html, e o lazyWithRetry
    # do App.tsx recarrega a pagina.
    location ~* "^/assets/.+-[A-Za-z0-9_-]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Todo o resto (index.html, rotas do app, imagens e videos sem hash): o
    # navegador guarda, mas confere com o servidor antes de usar (304 quando
    # nao mudou). Sem isso o navegador reaproveitava o index.html antigo por
    # horas depois de um deploy (cache heuristico, 19/10/2026).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
