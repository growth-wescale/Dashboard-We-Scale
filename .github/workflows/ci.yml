name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        env:
          VITE_LISO_OURO_ENABLED: 'true'
          VITE_LEGACY_OURO_ENABLED: 'true'
          VITE_PARTNER_OURO_ENABLED: 'true'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_VENDAS_URL: ${{ secrets.VITE_SUPABASE_VENDAS_URL }}
          VITE_SUPABASE_VENDAS_ANON_KEY: ${{ secrets.VITE_SUPABASE_VENDAS_ANON_KEY }}
        run: npm run build

      - name: Test
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_VENDAS_URL: ${{ secrets.VITE_SUPABASE_VENDAS_URL }}
          VITE_SUPABASE_VENDAS_ANON_KEY: ${{ secrets.VITE_SUPABASE_VENDAS_ANON_KEY }}
        run: npm test

      - name: Test readonly gateway
        run: python3 -m unittest discover -s server/partner_ouro -p 'test_*.py'

      - name: Test Liso readonly gateway
        run: python3 -m unittest discover -s server/liso_ouro -p 'test_*.py'

      - name: Test Legacy readonly gateway
        run: python3 -m unittest discover -s server/legacy_ouro -p 'test_*.py'
