name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_VENDAS_URL: ${{ secrets.VITE_SUPABASE_VENDAS_URL }}
          VITE_SUPABASE_VENDAS_ANON_KEY: ${{ secrets.VITE_SUPABASE_VENDAS_ANON_KEY }}
        run: npm run build

      - name: Configure SSH from base64 secret
        env:
          KEY_B64: ${{ secrets.VPS_DEPLOY_KEY_B64 }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$KEY_B64" || (echo "VPS_DEPLOY_KEY_B64 secret vazio"; exit 1)
          test -n "$VPS_HOST" || (echo "VPS_HOST secret vazio"; exit 1)
          # Debug: tamanho e prefixo (não expõe conteúdo). Esperado: ~577 chars, começa 'LS0t'.
          CLEAN=$(printf '%s' "$KEY_B64" | tr -d '[:space:]')
          echo "KEY_B64 tamanho: ${#CLEAN} chars"
          echo "KEY_B64 primeiros 4 chars: ${CLEAN:0:4}"
          echo "KEY_B64 últimos 4 chars: ${CLEAN: -4}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # tr -d remove whitespace/CR/LF que possam ter vazado no secret;
          # base64 -d puro é intolerante — precisa input limpo.
          printf '%s' "$CLEAN" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Valida se a chave é lida corretamente antes de tentar usar
          ssh-keygen -l -f ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH configurado com sucesso"

      - name: Rsync to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euxo pipefail
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            dist/ \
            root@"$VPS_HOST":/opt/dashboard/dist/

      - name: Verify deployment
        run: |
          sleep 2
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://dashboard.srv1816822.hstgr.cloud)
          if [ "$STATUS" != "200" ]; then
            echo "❌ Site respondeu HTTP $STATUS após deploy"
            exit 1
          fi
          echo "✅ Site respondendo HTTP 200"
