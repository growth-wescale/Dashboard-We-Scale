name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_VENDAS_URL: ${{ secrets.VITE_SUPABASE_VENDAS_URL }}
          VITE_SUPABASE_VENDAS_ANON_KEY: ${{ secrets.VITE_SUPABASE_VENDAS_ANON_KEY }}
        run: npm run build

      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_DEPLOY_KEY }}

      - name: Add VPS to known_hosts
        run: |
          set -euxo pipefail
          test -n "${{ secrets.VPS_HOST }}" || (echo "VPS_HOST secret is empty"; exit 1)
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          echo "known_hosts populated"

      - name: Rsync to VPS
        run: |
          set -euxo pipefail
          rsync -az --delete \
            dist/ \
            root@${{ secrets.VPS_HOST }}:/opt/dashboard/dist/

      - name: Verify deployment
        run: |
          sleep 2
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://dashboard.srv1816822.hstgr.cloud)
          if [ "$STATUS" != "200" ]; then
            echo "❌ Site respondeu HTTP $STATUS após deploy"
            exit 1
          fi
          echo "✅ Site respondendo HTTP 200"
